<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Emoji Kitchen — Game Central</title>
<link rel="icon" type="image/png" sizes="256x256" href="../favicon.png" />
<link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png?v=ios18" />
<link rel="stylesheet" href="../shared.css" />
<style>
  .slots{display:flex;gap:.6rem;align-items:center;justify-content:center}
  .slot{width:84px;height:84px;border-radius:18px;border:3px dashed var(--ocean);background:var(--surface-hover);display:flex;align-items:center;justify-content:center;font-size:2.6rem}
  .plus{font-size:1.8rem;font-weight:900;color:var(--text-muted)}
  .result{font-size:4.2rem;text-align:center;line-height:1.15;min-height:88px}
  .palette{display:grid;grid-template-columns:repeat(6,1fr);gap:.45rem;width:min(100%,440px)}
  .palette button{font-size:1.7rem;padding:.5rem 0;border-radius:12px;border:2px solid transparent;background:var(--surface-hover);cursor:pointer}
  .palette button.picked{border-color:var(--neon-green);background:rgba(57,255,20,.12)}
  .score-bar{display:flex;gap:1.25rem;flex-wrap:wrap;justify-content:center;font-weight:600;color:var(--text-muted)}
  .score-bar span{color:var(--neon-blue)}
  .creations{display:flex;flex-wrap:wrap;gap:.35rem;justify-content:center;font-size:1.5rem;max-width:460px}
  .hint{color:var(--text-muted);font-size:.85rem;text-align:center}
</style>
</head>
<body>
<div class="app"><main class="main">
<a class="back-link" href="../index.html">← Back to Arcade</a>
<header class="header"><div class="game-card-icon" aria-hidden="true">🥳</div><h1>Emoji Kitchen</h1><p class="tagline">Mix two emojis and cook up something new!</p></header>
<div class="game-panel">
  <div class="score-bar"><div>Creations: <span id="count">0</span></div></div>
  <p class="status" id="status">Pick two emojis, then tap Mix!</p>
  <div class="slots"><div class="slot" id="slotA">?</div><div class="plus">+</div><div class="slot" id="slotB">?</div></div>
  <div class="result" id="result" aria-live="polite"></div>
  <div class="palette" id="palette"></div>
  <div style="display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center">
    <button class="btn" type="button" id="mixBtn">Mix! 🪄</button>
    <button class="btn btn-secondary" type="button" id="clearBtn">Clear</button>
  </div>
  <div class="creations" id="creations" aria-label="Your creations"></div>
  <p class="hint">Some mixes have a surprise recipe. Others make a brand-new mashup!</p>
</div>
</main></div>
<script>
var PALETTE=["😀","😋","🐶","🐱","🐷","🐮","🐔","🍕","🍔","🍎","🍓","🍌","🥑","🌶️","🔥","💧","⭐","❤️","🐰","🦊","🐼","🐙","🦄","🌈"];
var RECIPES={
"🐶|🔥":"🌭 Hot Dog Hero","🍕|😋":"😋 Pizza Party Face","🐱|❤️":"😻 Heart-Eyes Cat","🐶|❤️":"🥰 Puppy Love",
"🍎|🔥":"🥧 Apple Pie","🍓|⭐":"✨ Starberry Sparkle","🍌|🐵":"🐵 Banana Monkey","🐮|🍔":"🍔 Burger Time",
"😀|🌈":"🌈 Happy Rainbow","🦄|⭐":"🌟 Unicorn Star","🐙|🎵":"🎶 Singing Octopus","🌶️|🔥":"🥵 Super Spicy!",
"💧|🌈":"🌦️ Rainy Rainbow","🐷|⭐":"🐽 Super Pig","🦊|🔥":"🦊 Firefox","🐼|❤️":"💖 Panda Hug",
"🍓|🍌":"🍹 Fruit Smoothie","😀|⭐":"🤩 Star-Struck","🐔|🔥":"🍗 Roast Chicken","🥑|😋":"🥑 Yummy Avocado",
"🐰|⭐":"✨ Bunny Magic","🐱|⭐":"😺 Cool Cat","❤️|🔥":"❤️‍🔥 Burning Love","😀|❤️":"🥰 So Happy"};
var picks=[],creations=[];
var statusEl=document.getElementById("status"),paletteEl=document.getElementById("palette");
function key(a,b){return [a,b].sort().join("|");}
PALETTE.forEach(function(e){var b=document.createElement("button");b.type="button";b.textContent=e;b.setAttribute("aria-label","Pick "+e);b.addEventListener("click",function(){pick(e,b);});paletteEl.appendChild(b);});
function pick(e,btn){
 if(picks.length>=2){clearPicks();}
 picks.push(e);
 if(picks.length===1){document.getElementById("slotA").textContent=e;btn.classList.add("picked");statusEl.textContent="Good choice! Pick one more.";}
 else{document.getElementById("slotB").textContent=e;btn.classList.add("picked");statusEl.textContent="Ready — tap Mix!";}
}
function clearPicks(){picks=[];document.getElementById("slotA").textContent="?";document.getElementById("slotB").textContent="?";document.getElementById("result").textContent="";paletteEl.querySelectorAll("button").forEach(function(b){b.classList.remove("picked");});statusEl.textContent="Pick two emojis, then tap Mix!";}
function mix(){
 if(picks.length<2){statusEl.textContent="Pick two emojis first!";return;}
 var a=picks[0],b=picks[1],recipe=RECIPES[key(a,b)],out,name;
 if(recipe){var parts=recipe.split(" ");out=parts[0];name=parts.slice(1).join(" ");statusEl.textContent="🎉 Recipe found: "+name+"!";}
 else{out=a+b;name="Mashup";statusEl.textContent="✨ New mashup: "+a+" + "+b+"!";}
 document.getElementById("result").textContent=out;
 if(creations.indexOf(out)===-1){creations.push(out);var s=document.createElement("span");s.textContent=out;document.getElementById("creations").appendChild(s);document.getElementById("count").textContent=creations.length;}
 picks=[];
}
document.getElementById("mixBtn").addEventListener("click",mix);
document.getElementById("clearBtn").addEventListener("click",clearPicks);
</script>
<script src="../shared.js"></script>
</body>
</html>
