<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Minesweeper — Game Central</title>
<link rel="icon" type="image/png" sizes="256x256" href="../favicon.png" />
<link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png?v=ios18" />
<link rel="stylesheet" href="../shared.css" />
<style>
  .board{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;width:min(100%,380px);margin:0 auto}
  .cell{aspect-ratio:1;border:2px solid var(--ocean);border-radius:8px;background:var(--surface-hover);color:var(--text);font-family:inherit;font-size:1rem;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;touch-action:manipulation}
  .cell.open{background:#0d1220;border-color:rgba(255,255,255,.15);cursor:default}
  .cell.mine{background:rgba(255,45,170,.25)}
  .n1{color:#3ec6ff}.n2{color:#59d95e}.n3{color:#ff5a5a}.n4{color:#b07aff}.n5{color:#ffb340}.n6{color:#ff7ad9}.n7{color:#ffe14d}.n8{color:#fff}
  .score-bar{display:flex;gap:1.25rem;flex-wrap:wrap;justify-content:center;font-weight:600;color:var(--text-muted)}
  .score-bar span{color:var(--neon-blue)}
  .mode-btn[aria-pressed="true"]{background:linear-gradient(135deg,var(--neon-pink),var(--neon-purple))}
  .hint{color:var(--text-muted);font-size:.85rem;text-align:center}
</style>
</head>
<body>
<div class="app"><main class="main">
<a class="back-link" href="../index.html">← Back to Arcade</a>
<header class="header"><div class="game-card-icon" aria-hidden="true">🌸</div><h1>Minesweeper</h1><p class="tagline">Find the flowers — don't tap a mine!</p></header>
<div class="game-panel">
  <div class="score-bar"><div>Mines: <span id="minesLeft">10</span> 💣</div><div>Time: <span id="time">0</span>s</div></div>
  <p class="status" id="status">Tap a square to start. Your first tap is always safe!</p>
  <div class="board" id="board" role="grid" aria-label="Minesweeper board"></div>
  <div style="display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center">
    <button class="btn btn-secondary mode-btn" type="button" id="flagBtn" aria-pressed="false">🚩 Flag mode: OFF</button>
    <button class="btn btn-secondary" type="button" id="newBtn">New game</button>
  </div>
  <p class="hint">Numbers tell you how many mines touch that square. Right-click (or Flag mode) to plant a flag.</p>
</div>
</main></div>
<script>
var SIZE=9,MINES=10,cells=[],started=false,over=false,won=false,flags=0,flagMode=false,timer=null,seconds=0;
var boardEl=document.getElementById("board"),statusEl=document.getElementById("status");
function idx(r,c){return r*SIZE+c;}
function newGame(){
 cells=[];started=false;over=false;won=false;flags=0;seconds=0;clearInterval(timer);timer=null;
 document.getElementById("time").textContent="0";document.getElementById("minesLeft").textContent=MINES;
 statusEl.textContent="Tap a square to start. Your first tap is always safe!";
 for(var i=0;i<SIZE*SIZE;i++)cells.push({mine:false,open:false,flag:false,n:0});
 render();
}
function placeMines(safeR,safeC){
 var placed=0;while(placed<MINES){var r=Math.floor(Math.random()*SIZE),c=Math.floor(Math.random()*SIZE);if(Math.abs(r-safeR)<=1&&Math.abs(c-safeC)<=1)continue;var cell=cells[idx(r,c)];if(cell.mine)continue;cell.mine=true;placed++;}
 for(var r2=0;r2<SIZE;r2++)for(var c2=0;c2<SIZE;c2++){var n=0;forEachNeighbor(r2,c2,function(nr,nc){if(cells[idx(nr,nc)].mine)n++;});cells[idx(r2,c2)].n=n;}
 timer=setInterval(function(){seconds++;document.getElementById("time").textContent=seconds;},1000);
}
function forEachNeighbor(r,c,fn){for(var dr=-1;dr<=1;dr++)for(var dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;var nr=r+dr,nc=c+dc;if(nr<0||nr>=SIZE||nc<0||nc>=SIZE)continue;fn(nr,nc);}}
function render(){
 boardEl.innerHTML="";
 cells.forEach(function(cell,i){var r=Math.floor(i/SIZE),c=i%SIZE;var b=document.createElement("button");b.type="button";b.className="cell"+(cell.open?" open":"")+((over||won)&&cell.mine?" mine":"");b.setAttribute("aria-label","Square row "+(r+1)+" column "+(c+1));
  if(cell.flag)b.textContent="🚩";else if(cell.open&&cell.mine)b.textContent="💣";else if(cell.open&&cell.n>0){b.textContent=cell.n;b.classList.add("n"+cell.n);}
  b.addEventListener("click",function(){tap(r,c);});
  b.addEventListener("contextmenu",function(e){e.preventDefault();toggleFlag(r,c);});
  boardEl.appendChild(b);});
 document.getElementById("minesLeft").textContent=MINES-flags;
}
function toggleFlag(r,c){if(over||won)return;var cell=cells[idx(r,c)];if(cell.open)return;cell.flag=!cell.flag;flags+=cell.flag?1:-1;render();}
function reveal(r,c){
 var cell=cells[idx(r,c)];if(cell.open||cell.flag)return;cell.open=true;
 if(cell.n===0&&!cell.mine)forEachNeighbor(r,c,function(nr,nc){reveal(nr,nc);});
}
function tap(r,c){
 if(over||won)return;
 if(flagMode){toggleFlag(r,c);return;}
 var cell=cells[idx(r,c)];if(cell.flag||cell.open)return;
 if(!started){started=true;placeMines(r,c);}
 if(cell.mine){cell.open=true;over=true;clearInterval(timer);cells.forEach(function(x){if(x.mine)x.open=true;});statusEl.textContent="💥 Boom! That was a mine. Tap New game to try again.";render();return;}
 reveal(r,c);
 if(cells.every(function(x){return x.mine||x.open;})){won=true;clearInterval(timer);statusEl.textContent="🎉 You cleared the field in "+seconds+" seconds!";}
 else statusEl.textContent="Nice and safe. Keep going!";
 render();
}
document.getElementById("flagBtn").addEventListener("click",function(){flagMode=!flagMode;this.setAttribute("aria-pressed",String(flagMode));this.textContent=flagMode?"🚩 Flag mode: ON":"🚩 Flag mode: OFF";});
document.getElementById("newBtn").addEventListener("click",newGame);
newGame();
</script>
<script src="../shared.js"></script>
</body>
</html>
